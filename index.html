<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试单词本</title>
<style>
body{background:#f8f9fa;padding:40px;font-size:24px;text-align:center;}
</style>
</head>
<body>
<div>测试页面成功！</div>
<div id="word"></div>
<button onclick="next()">下一个</button>
<script>
let list = [
{"word":"apple","meaning":"苹果"},
{"word":"banana","meaning":"香蕉"},
{"word":"cat","meaning":"猫"},
{"word":"dog","meaning":"狗"},
{"word":"egg","meaning":"鸡蛋"}
];
let idx=0;
function show(){
document.getElementById("word").innerText = list[idx].word + " " + list[idx].meaning;
}
function next(){
idx=(idx+1)%list.length;
show();
}
show();
</script>
</body>
</html>
